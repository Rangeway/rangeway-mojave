          - paragraph [ref=e148]: Rangeway sits at the intersection of two worlds. One is a long career in hospitality, across luxury resorts, wellness retreats, and flagship urban hotels, where we learned what a great stop feels like. The other is a deep presence in the EV driver community, leading clubs and hosting podcasts, where we learned what charging could be. Rangeway is what happens when those worlds meet.
