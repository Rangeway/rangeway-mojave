    - generic [ref=e48]:
      - generic [ref=e50]: Why Here
      - generic [ref=e51]:
        - heading "The corridor that's been waiting." [level=2] [ref=e52]
        - generic [ref=e53]:
          - paragraph [ref=e54]: The CA-14 corridor connects the Los Angeles basin to the high desert and points north. It is the daily commute for the aerospace and defense workforce at Edwards Air Force Base, Northrop Grumman, Lockheed Martin, Boeing, NASA, and Virgin Galactic, and on weekends, it carries travelers heading to the Eastern Sierra and beyond.
          - paragraph [ref=e55]: It is one of the busiest single corridors in California without a hospitality-led charging stop. The drivers who use it are technically literate and early to EV adoption, and they drive this stretch every day. Right now, they have nowhere to charge in a place worth waiting in. Rangeway Mojave changes that.
    - generic [ref=e58]:
      - generic [ref=e59]:
        - blockquote [ref=e60]:
          - text: In a desert corridor where summer afternoons run hot enough to make charging miserable in any open lot,
          - emphasis [ref=e61]: indoor comfort is not an amenity, it is the product.
        - paragraph [ref=e62]: Zak Winnick, Founder and CEO
      - figure "Render The charging plaza at dusk" [ref=e63]:
