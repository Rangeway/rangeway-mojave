        - text: . The lounge grows with the site.
    - generic [ref=e102]:
      - generic [ref=e104]: How It Works
      - generic [ref=e105]:
        - heading "Sunlight in, electrons out, grid optional." [level=2] [ref=e106]
        - paragraph [ref=e107]: This is not experimental technology. We are deploying a proven platform, not testing a prototype.
      - generic [ref=e108]:
        - generic [ref=e109]:
          - heading "Solar panels generate the power." [level=3] [ref=e110]
          - paragraph [ref=e111]: A ground-mounted solar array captures Mojave sunlight across several acres of dedicated solar field, in one of the strongest solar-resource areas in the United States.
        - generic [ref=e112]:
          - heading "Batteries store it." [level=3] [ref=e113]
          - paragraph [ref=e114]: A battery energy storage system holds the energy and manages load, ensuring consistent charging power regardless of time of day or cloud cover.
        - generic [ref=e115]:
          - heading "Chargers deliver it." [level=3] [ref=e116]
          - paragraph [ref=e117]: Ultra-fast DC charging ports dispense the stored solar energy directly to your vehicle, and the entire system operates independently of the electrical grid.
