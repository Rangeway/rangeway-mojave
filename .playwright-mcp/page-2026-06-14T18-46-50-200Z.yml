      - generic [ref=e72]: Phase I
      - generic [ref=e73]:
        - heading "Built from the ground up, powered by the sun." [level=2] [ref=e74]
        - paragraph [ref=e75]:
          - text: Engineered by
          - link "Carbon DC" [ref=e76] [cursor=pointer]:
            - /url: https://carbondc.io
          - text: ", whose off-grid platform is already operating at multiple sites across California's desert corridors."
      - generic [ref=e77]:
        - generic [ref=e78]:
          - heading "Charging under bamboo." [level=3] [ref=e79]
          - paragraph [ref=e80]: An open-bay charging plaza beneath a custom canopy of structurally engineered bamboo, where pulling in feels like pulling up to a property, not a parking lot.
        - generic [ref=e81]:
          - heading "Solar that's already running." [level=3] [ref=e82]
          - paragraph [ref=e83]: On-site solar generation and battery energy storage, integrated into a single off-grid platform that Carbon DC already operates at sites across North America.
        - generic [ref=e84]:
          - heading "Food from our food truck." [level=3] [ref=e85]
          - paragraph [ref=e86]: Fresh food and drinks served from our on-site electric food truck, because you deserve more than a vending machine while you wait.
        - generic [ref=e87]:
          - heading "A lounge from day one." [level=3] [ref=e88]
          - paragraph [ref=e89]: A climate-controlled mobile lounge, solar-powered and built for the desert, giving drivers a comfortable place to sit, cool off, and wait from the day we open.
        - generic [ref=e90]:
          - heading "A site shaped by place." [level=3] [ref=e91]
          - paragraph [ref=e92]: Native high-desert landscaping, shaded seating that holds the afternoon, and a layout designed to read as part of the Mojave Desert, not bolted onto it.
      - figure "Plate Phase I concept · Solar field, battery storage, charging plaza, and food truck seating" [ref=e93]:
        - img "Daytime aerial rendering of Rangeway Mojave with the solar field, battery storage, bamboo charging canopy, food truck, and shaded seating beside the CA-14" [ref=e95]
