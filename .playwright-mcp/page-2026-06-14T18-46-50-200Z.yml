          - generic [ref=e98]: Phase I concept · Solar field, battery storage, charging plaza, and food truck seating
      - paragraph [ref=e99]:
        - text: "Phase II grows the mobile lounge into the full Basecamp experience: a permanent, climate-controlled building with a staffed cafe, comfortable seating, comfortable restrooms, and on-site coffee roasting from"
        - link "Red Canyon Roasting Company" [ref=e100] [cursor=pointer]:
